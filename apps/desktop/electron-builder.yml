appId: dev.cocode.desktop
productName: Cocode
asar: true
npmRebuild: false

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: build/bin
    to: .
    filter:
      - cocoded*
  - from: ../../assets/app-icon
    to: assets/app-icon

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  category: Development
  target:
    - AppImage
