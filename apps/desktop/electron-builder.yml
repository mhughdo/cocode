appId: dev.cocode.desktop
productName: cocode
asar: true
npmRebuild: false

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: build/bin
    to: .
    filter:
      - cocoded*

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  category: Development
  target:
    - AppImage
