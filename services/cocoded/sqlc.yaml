version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/db/sql/schema.sql"
    queries: "internal/db/sql/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/db/dbgen"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
